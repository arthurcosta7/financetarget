spring:
  application:
    name: financetarget-api
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
  max-http-request-header-size: ${SERVER_MAX_HTTP_REQUEST_HEADER_SIZE:16KB}
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework

app:
  environment: ${APP_ENV}
  deployment:
    expected-release-id: ${APP_EXPECTED_RELEASE_ID:local}
  product:
    default-currency: ${APP_DEFAULT_CURRENCY}
    business-time-zone: ${APP_BUSINESS_TIME_ZONE}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  auth:
    access-ttl: ${APP_AUTH_ACCESS_TTL:15m}
    refresh-ttl: ${APP_AUTH_REFRESH_TTL:30d}
    verification-ttl: ${APP_AUTH_VERIFICATION_TTL:24h}
    recovery-ttl: ${APP_AUTH_RECOVERY_TTL:30m}
    secure-cookies: ${APP_AUTH_SECURE_COOKIES:true}
    access-cookie-name: ${APP_AUTH_ACCESS_COOKIE:ft_access}
    refresh-cookie-name: ${APP_AUTH_REFRESH_COOKIE:ft_refresh}
    minimum-password-length: ${APP_AUTH_PASSWORD_MIN_LENGTH:15}
    maximum-password-length: ${APP_AUTH_PASSWORD_MAX_LENGTH:128}
    attempt-limit: ${APP_AUTH_ATTEMPT_LIMIT:10}
    attempt-window: ${APP_AUTH_ATTEMPT_WINDOW:1m}
  legal-documents:
    terms-version: ${APP_TERMS_VERSION}
    privacy-notice-version: ${APP_PRIVACY_NOTICE_VERSION}
  beta:
    enabled: ${APP_BETA_ENABLED:false}
    invitation-ttl: ${APP_BETA_INVITATION_TTL:7d}
    invitation-daily-limit: ${APP_BETA_INVITATION_DAILY_LIMIT:5}
    maximum-shared-members: ${APP_BETA_MAXIMUM_SHARED_MEMBERS:2}
    feedback-comment-maximum-length: ${APP_BETA_FEEDBACK_COMMENT_MAX_LENGTH:500}
  features:
    payments-mock: ${APP_FEATURE_PAYMENTS_MOCK:false}
    notifications-mock: ${APP_FEATURE_NOTIFICATIONS_MOCK:false}
    open-finance: ${APP_FEATURE_OPEN_FINANCE:false}
    loyalty: ${APP_FEATURE_LOYALTY:false}
    travel: ${APP_FEATURE_TRAVEL:false}
    real-estate-financing: ${APP_FEATURE_REAL_ESTATE_FINANCING:false}
    auto-financing: ${APP_FEATURE_AUTO_FINANCING:false}
  mock-integrations:
    payment-webhook-secret: ${APP_MOCK_PAYMENT_WEBHOOK_SECRET:}
    webhook-replay-tolerance: ${APP_MOCK_WEBHOOK_REPLAY_TOLERANCE:5m}
  integrations:
    resend:
      enabled: ${APP_INTEGRATION_RESEND_ENABLED:false}
      api-key: ${RESEND_API_KEY:}
      endpoint: ${APP_RESEND_ENDPOINT:https://api.resend.com/emails}
      from-email: ${APP_EMAIL_FROM_ADDRESS:}
      from-name: ${APP_EMAIL_FROM_NAME:FinanceTarget}
      frontend-base-url: ${APP_PUBLIC_WEB_URL:http://localhost:3000}
      connect-timeout: ${APP_RESEND_CONNECT_TIMEOUT:3s}
      read-timeout: ${APP_RESEND_READ_TIMEOUT:8s}

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
    prometheus:
      access: read-only
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.05}

logging:
  pattern:
    correlation: "[requestId=%X{requestId:-none} traceId=%X{traceId:-none} spanId=%X{spanId:-none}] "
