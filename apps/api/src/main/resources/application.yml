spring:
  application:
    name: financetarget-api
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework

app:
  environment: ${APP_ENV}
  product:
    default-currency: ${APP_DEFAULT_CURRENCY}
    business-time-zone: ${APP_BUSINESS_TIME_ZONE}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  auth:
    access-ttl: ${APP_AUTH_ACCESS_TTL:15m}
    refresh-ttl: ${APP_AUTH_REFRESH_TTL:30d}
    verification-ttl: ${APP_AUTH_VERIFICATION_TTL:24h}
    recovery-ttl: ${APP_AUTH_RECOVERY_TTL:30m}
    secure-cookies: ${APP_AUTH_SECURE_COOKIES:true}
    access-cookie-name: ${APP_AUTH_ACCESS_COOKIE:ft_access}
    refresh-cookie-name: ${APP_AUTH_REFRESH_COOKIE:ft_refresh}
    minimum-password-length: ${APP_AUTH_PASSWORD_MIN_LENGTH:15}
    maximum-password-length: ${APP_AUTH_PASSWORD_MAX_LENGTH:128}
    attempt-limit: ${APP_AUTH_ATTEMPT_LIMIT:10}
    attempt-window: ${APP_AUTH_ATTEMPT_WINDOW:1m}
  legal-documents:
    terms-version: ${APP_TERMS_VERSION}
    privacy-notice-version: ${APP_PRIVACY_NOTICE_VERSION}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
