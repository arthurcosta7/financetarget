openapi: 3.1.0
info:
  title: FinanceTarget API
  version: 0.8.0
  description: Contrato do MVP manual, colaboração, aprendizado de beta, rastreabilidade de release, assinaturas e hubs isolados.
servers:
  - url: /api/v1
paths:
  /system/status:
    get:
      operationId: getSystemStatus
      tags: [System]
      responses:
        "200":
          description: Fundação disponível.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
  /auth/csrf:
    get:
      operationId: bootstrapCsrf
      tags: [Identity]
      responses:
        "200":
          description: Cookie e metadados CSRF.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsrfResponse" }
  /auth/registrations:
    post:
      operationId: registerAccount
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationRequest" }
      responses:
        "202":
          description: Resposta neutra, inclusive para conta existente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/verifications:
    post:
      operationId: verifyEmail
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "204": { description: Conta verificada e espaço pessoal criado. }
        "400": { $ref: "#/components/responses/Problem" }
  /auth/verification-requests:
    post:
      operationId: requestEmailVerification
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoveryRequest" }
      responses:
        "202":
          description: Resposta neutra, inclusive para conta inexistente ou já verificada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/sessions:
    post:
      operationId: login
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "204": { description: Cookies HttpOnly emitidos. }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/sessions/refresh:
    post:
      operationId: refreshSession
      tags: [Identity]
      responses:
        "204": { description: Tokens rotacionados. }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/sessions/current:
    delete:
      operationId: logout
      tags: [Identity]
      responses:
        "204": { description: Família revogada e cookies removidos. }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/me:
    get:
      operationId: getCurrentAccount
      tags: [Identity]
      responses:
        "200":
          description: Conta autenticada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResponse" }
        "401": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateCurrentAccount
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAccountRequest" }
      responses:
        "200":
          description: Conta atualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/password-recovery-requests:
    post:
      operationId: requestPasswordRecovery
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoveryRequest" }
      responses:
        "202":
          description: Resposta neutra, inclusive para conta inexistente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/password-recoveries:
    post:
      operationId: resetPassword
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204": { description: Senha alterada e sessões revogadas. }
        "400": { $ref: "#/components/responses/Problem" }
  /onboarding/requirements:
    get:
      operationId: getOnboardingRequirements
      tags: [Onboarding]
      responses:
        "200":
          description: Versões configuradas dos documentos aplicáveis.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingRequirements" }
        "401": { $ref: "#/components/responses/Problem" }
  /onboarding/financial-profile:
    get:
      operationId: getFinancialProfile
      tags: [Onboarding]
      responses:
        "200":
          description: Perfil financeiro pessoal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialProfile" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      operationId: saveFinancialProfile
      tags: [Onboarding]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveFinancialProfileRequest" }
      responses:
        "200":
          description: Perfil e estimativa calculada no backend.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialProfile" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /privacy/exports:
    post:
      operationId: exportOwnData
      tags: [Privacy]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthenticationRequest" }
      responses:
        "200":
          description: Dados próprios, sem credenciais ou tokens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalDataExport" }
        "401": { $ref: "#/components/responses/Problem" }
  /privacy/deletion-requests:
    post:
      operationId: requestDeletion
      tags: [Privacy]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthenticationRequest" }
      responses:
        "202":
          description: Solicitação registrada, sem exclusão física nesta fase.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataSubjectRequest" }
        "401": { $ref: "#/components/responses/Problem" }
  /privacy/deletion-requests/current:
    get:
      operationId: getDeletionRequest
      tags: [Privacy]
      responses:
        "200":
          description: Solicitação mais recente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataSubjectRequest" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /planning-spaces:
    get:
      operationId: listPlanningSpaces
      tags: [Planning spaces]
      responses:
        "200":
          description: Espaços em que a conta possui associação ativa.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PlanningSpace" } }
    post:
      operationId: createSharedPlanningSpace
      tags: [Planning spaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePlanningSpace" }
      responses:
        "201":
          description: Espaço compartilhado criado com o solicitante como proprietário.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanningSpace" }
        "400": { $ref: "#/components/responses/Problem" }
  /planning-spaces/{spaceId}/invitations:
    parameters: [{ $ref: "#/components/parameters/SpaceId" }]
    post:
      operationId: invitePlanningSpaceMember
      tags: [Planning spaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSpaceInvitation" }
      responses:
        "202":
          description: Convite autenticado criado sem revelar existência da conta destinatária.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpaceInvitation" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /planning-space-invitations:
    get:
      operationId: listReceivedSpaceInvitations
      tags: [Planning spaces]
      responses:
        "200":
          description: Convites pendentes vinculados ao e-mail autenticado.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SpaceInvitation" } }
  /planning-space-invitations/{invitationId}/responses:
    parameters:
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: respondToSpaceInvitation
      tags: [Planning spaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationDecision" }
      responses:
        "204": { description: Convite aceito ou recusado. }
        "404": { $ref: "#/components/responses/Problem" }
  /planning-spaces/{spaceId}/members:
    parameters: [{ $ref: "#/components/parameters/SpaceId" }]
    get:
      operationId: listPlanningSpaceMembers
      tags: [Planning spaces]
      responses:
        "200":
          description: Participantes ativos sem exposição de e-mail.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SpaceMember" } }
        "404": { $ref: "#/components/responses/Problem" }
  /planning-spaces/{spaceId}/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: changePlanningSpaceMemberRole
      tags: [Planning spaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeSpaceRole" }
      responses:
        "204": { description: Papel alterado por um proprietário. }
        "404": { $ref: "#/components/responses/Problem" }
  /planning-spaces/{spaceId}/financial-profile:
    parameters: [{ $ref: "#/components/parameters/SpaceId" }]
    get:
      operationId: getPlanningSpaceFinancialProfile
      tags: [Planning spaces]
      responses:
        "200":
          description: Perfil agregado explicitamente informado no espaço.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialProfile" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      operationId: savePlanningSpaceFinancialProfile
      tags: [Planning spaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveSharedFinancialProfile" }
      responses:
        "200":
          description: Perfil agregado atualizado por proprietário ou editor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialProfile" }
        "404": { $ref: "#/components/responses/Problem" }
  /beta/config:
    get:
      operationId: getClosedBetaConfig
      tags: [Beta]
      responses:
        "200":
          description: Estado técnico; não equivale a autorização de entrada de pessoas reais.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BetaConfig" }
  /beta/events:
    post:
      operationId: recordAllowlistedBetaEvent
      tags: [Beta]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BetaEvent" }
      responses:
        "202": { description: Evento aceito ou descartado quando o beta está desligado. }
        "400": { $ref: "#/components/responses/Problem" }
  /beta/feedback:
    post:
      operationId: submitClosedBetaFeedback
      tags: [Beta]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BetaFeedbackRequest" }
      responses:
        "201":
          description: Feedback estruturado registrado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BetaFeedback" }
        "404": { $ref: "#/components/responses/Problem" }
  /planning-spaces/{spaceId}/goals:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      operationId: listGoals
      tags: [Goals]
      responses:
        "200":
          description: Metas ativas visíveis no espaço.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Goal" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createGoal
      tags: [Goals]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGoalRequest" }
      responses:
        "201":
          description: Meta e snapshot inicial criados.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /planning-spaces/{spaceId}/goals/{goalId}:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - $ref: "#/components/parameters/GoalId"
    get:
      operationId: getGoal
      tags: [Goals]
      responses:
        "200":
          description: Meta, snapshot e acompanhamento manual.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /planning-spaces/{spaceId}/goals/{goalId}/contributions:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - $ref: "#/components/parameters/GoalId"
    post:
      operationId: recordContribution
      tags: [Goals]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContributionRequest" }
      responses:
        "201":
          description: Contribuição registrada uma única vez.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContributionResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /planning-spaces/{spaceId}/goals/{goalId}/scenarios:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - $ref: "#/components/parameters/GoalId"
    get:
      operationId: compareGoalScenarios
      tags: [Scenarios]
      responses:
        "200":
          description: Base e histórico de até três cenários reproduzíveis.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScenarioComparison" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createGoalScenario
      tags: [Scenarios]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateScenarioRequest" }
      responses:
        "201":
          description: Cenário e snapshot imutável criados.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScenarioComparison" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /features:
    get:
      operationId: getFeatureFlags
      tags: [System]
      responses:
        "200":
          description: Flags públicas para a experiência autenticada; não substituem autorização.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureFlags" }
        "401": { $ref: "#/components/responses/Problem" }
  /subscriptions/current:
    get:
      operationId: getCurrentSubscription
      tags: [Subscriptions]
      responses:
        "200":
          description: Estado canônico, benefícios internos e catálogo do ambiente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionOverview" }
        "401": { $ref: "#/components/responses/Problem" }
  /subscriptions/mock-checkouts:
    post:
      operationId: createMockCheckout
      tags: [Subscriptions]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMockCheckoutRequest" }
      responses:
        "201":
          description: Sessão simulada criada sem cobrança ou redirecionamento externo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MockCheckout" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /notification-preferences:
    get:
      operationId: getNotificationPreferences
      tags: [Notifications]
      responses:
        "200":
          description: Preferências atuais; comunicações essenciais não são opcionais.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
    put:
      operationId: updateNotificationPreferences
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateNotificationPreferences" }
      responses:
        "200":
          description: Preferências atualizadas sem realizar envio.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
        "400": { $ref: "#/components/responses/Problem" }
  /integrations/payments/webhooks/mock:
    post:
      operationId: receiveMockPaymentWebhook
      tags: [Integrations]
      parameters:
        - { name: X-Mock-Event-Id, in: header, required: true, schema: { type: string, maxLength: 160 } }
        - { name: X-Mock-Timestamp, in: header, required: true, schema: { type: string, format: date-time } }
        - { name: X-Mock-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MockPaymentWebhook" }
      responses:
        "202": { description: Evento assinado aceito ou repetição idempotente reconhecida. }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    SpaceId:
      name: spaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GoalId:
      name: goalId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: Erro em formato Problem Details.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    PlanningSpace:
      type: object
      required: [id, type, name, baseCurrency, role, memberCount, profileConfigured]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [PERSONAL, SHARED] }
        name: { type: string }
        baseCurrency: { type: string, pattern: "^[A-Z]{3}$" }
        role: { $ref: "#/components/schemas/SpaceRole" }
        memberCount: { type: integer, minimum: 1 }
        profileConfigured: { type: boolean }
    SpaceRole:
      type: string
      enum: [OWNER, EDITOR, VIEWER]
    CreatePlanningSpace:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
    CreateSpaceInvitation:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        role: { $ref: "#/components/schemas/SpaceRole" }
    SpaceInvitation:
      type: object
      required: [id, spaceId, role, status, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        spaceId: { type: string, format: uuid }
        spaceName: { type: [string, "null"] }
        inviterName: { type: [string, "null"] }
        role: { $ref: "#/components/schemas/SpaceRole" }
        status: { type: string, enum: [PENDING, ACCEPTED, REJECTED, EXPIRED] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    InvitationDecision:
      type: object
      additionalProperties: false
      required: [accept]
      properties:
        accept: { type: boolean }
    SpaceMember:
      type: object
      required: [userId, displayName, role, joinedAt]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        role: { $ref: "#/components/schemas/SpaceRole" }
        joinedAt: { type: string, format: date-time }
    ChangeSpaceRole:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/SpaceRole" }
    SaveSharedFinancialProfile:
      type: object
      additionalProperties: false
      required: [recurringIncome, essentialExpenses, initialGoalBalance, confirmedMonthlyCapacity]
      properties:
        recurringIncome: { type: string, pattern: "^[0-9]{1,17}(\\.[0-9]{1,2})?$" }
        essentialExpenses: { type: string, pattern: "^[0-9]{1,17}(\\.[0-9]{1,2})?$" }
        initialGoalBalance: { type: string, pattern: "^[0-9]{1,17}(\\.[0-9]{1,2})?$" }
        confirmedMonthlyCapacity: { type: string, pattern: "^[0-9]{1,17}(\\.[0-9]{1,2})?$" }
    BetaConfig:
      type: object
      required: [enabled, feedbackEnabled, maximumSharedMembers]
      properties:
        enabled: { type: boolean }
        feedbackEnabled: { type: boolean }
        maximumSharedMembers: { type: integer, minimum: 2, maximum: 10 }
    BetaEvent:
      type: object
      additionalProperties: false
      required: [eventName, journeyStage, outcome, deviceClass]
      properties:
        eventName: { type: string, enum: [DASHBOARD_VIEWED, GOAL_CREATED, SCENARIO_CREATED, SPACE_CREATED, INVITATION_ACCEPTED, FEEDBACK_SUBMITTED] }
        journeyStage: { type: string, enum: [ACTIVATION, PLANNING, COLLABORATION, RETENTION, TRUST] }
        outcome: { type: string, enum: [STARTED, COMPLETED, ABANDONED, FAILED] }
        deviceClass: { type: string, enum: [MOBILE, TABLET, DESKTOP, UNKNOWN] }
    BetaFeedbackRequest:
      type: object
      additionalProperties: false
      required: [category]
      properties:
        category: { type: string, enum: [COMPREHENSION, USABILITY, TRUST, COLLABORATION, PROBLEM] }
        rating: { type: [integer, "null"], minimum: 1, maximum: 5 }
        comment: { type: [string, "null"], maxLength: 500 }
    BetaFeedback:
      type: object
      required: [id, category, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        category: { type: string }
        rating: { type: [integer, "null"] }
        status: { type: string, enum: [OPEN, REVIEWED] }
        createdAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [title, status, detail]
      properties:
        title: { type: string }
        status: { type: integer }
