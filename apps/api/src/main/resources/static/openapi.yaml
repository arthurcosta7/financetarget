openapi: 3.1.0
info:
  title: FinanceTarget API
  version: 0.4.0
  description: Contrato da identidade, onboarding e primeira fatia vertical de metas.
servers:
  - url: /api/v1
paths:
  /system/status:
    get:
      operationId: getSystemStatus
      tags: [System]
      responses:
        "200":
          description: Fundação disponível.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
  /auth/csrf:
    get:
      operationId: bootstrapCsrf
      tags: [Identity]
      responses:
        "200":
          description: Cookie e metadados CSRF.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsrfResponse" }
  /auth/registrations:
    post:
      operationId: registerAccount
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationRequest" }
      responses:
        "202":
          description: Resposta neutra, inclusive para conta existente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/verifications:
    post:
      operationId: verifyEmail
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "204": { description: Conta verificada e espaço pessoal criado. }
        "400": { $ref: "#/components/responses/Problem" }
  /auth/sessions:
    post:
      operationId: login
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "204": { description: Cookies HttpOnly emitidos. }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/sessions/refresh:
    post:
      operationId: refreshSession
      tags: [Identity]
      responses:
        "204": { description: Tokens rotacionados. }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/sessions/current:
    delete:
      operationId: logout
      tags: [Identity]
      responses:
        "204": { description: Família revogada e cookies removidos. }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/me:
    get:
      operationId: getCurrentAccount
      tags: [Identity]
      responses:
        "200":
          description: Conta autenticada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResponse" }
        "401": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateCurrentAccount
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAccountRequest" }
      responses:
        "200":
          description: Conta atualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/password-recovery-requests:
    post:
      operationId: requestPasswordRecovery
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoveryRequest" }
      responses:
        "202":
          description: Resposta neutra, inclusive para conta inexistente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/password-recoveries:
    post:
      operationId: resetPassword
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204": { description: Senha alterada e sessões revogadas. }
        "400": { $ref: "#/components/responses/Problem" }
  /onboarding/requirements:
    get:
      operationId: getOnboardingRequirements
      tags: [Onboarding]
      responses:
        "200":
          description: Versões configuradas dos documentos aplicáveis.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingRequirements" }
        "401": { $ref: "#/components/responses/Problem" }
  /onboarding/financial-profile:
    get:
      operationId: getFinancialProfile
      tags: [Onboarding]
      responses:
        "200":
          description: Perfil financeiro pessoal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialProfile" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      operationId: saveFinancialProfile
      tags: [Onboarding]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveFinancialProfileRequest" }
      responses:
        "200":
          description: Perfil e estimativa calculada no backend.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialProfile" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /privacy/exports:
    post:
      operationId: exportOwnData
      tags: [Privacy]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthenticationRequest" }
      responses:
        "200":
          description: Dados próprios, sem credenciais ou tokens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalDataExport" }
        "401": { $ref: "#/components/responses/Problem" }
  /privacy/deletion-requests:
    post:
      operationId: requestDeletion
      tags: [Privacy]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthenticationRequest" }
      responses:
        "202":
          description: Solicitação registrada, sem exclusão física nesta fase.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataSubjectRequest" }
        "401": { $ref: "#/components/responses/Problem" }
  /privacy/deletion-requests/current:
    get:
      operationId: getDeletionRequest
      tags: [Privacy]
      responses:
        "200":
          description: Solicitação mais recente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataSubjectRequest" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /planning-spaces/{spaceId}/goals:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      operationId: listGoals
      tags: [Goals]
      responses:
        "200":
          description: Metas ativas visíveis no espaço.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Goal" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createGoal
      tags: [Goals]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGoalRequest" }
      responses:
        "201":
          description: Meta e snapshot inicial criados.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /planning-spaces/{spaceId}/goals/{goalId}:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - $ref: "#/components/parameters/GoalId"
    get:
      operationId: getGoal
      tags: [Goals]
      responses:
        "200":
          description: Meta, snapshot e acompanhamento manual.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /planning-spaces/{spaceId}/goals/{goalId}/contributions:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - $ref: "#/components/parameters/GoalId"
    post:
      operationId: recordContribution
      tags: [Goals]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContributionRequest" }
      responses:
        "201":
          description: Contribuição registrada uma única vez.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContributionResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /planning-spaces/{spaceId}/goals/{goalId}/scenarios:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - $ref: "#/components/parameters/GoalId"
    get:
      operationId: compareGoalScenarios
      tags: [Scenarios]
      responses:
        "200":
          description: Base e histórico de até três cenários reproduzíveis.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScenarioComparison" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createGoalScenario
      tags: [Scenarios]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateScenarioRequest" }
      responses:
        "201":
          description: Cenário e snapshot imutável criados.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScenarioComparison" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    SpaceId:
      name: spaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GoalId:
      name: goalId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: Erro em formato Problem Details.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [title, status, detail]
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    SystemStatus:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [UP] }
        database:
          type: object
          required: [status, schemaVersion]
          properties:
            status: { type: string, enum: [UP] }
            schemaVersion: { type: string }
    CsrfResponse:
      type: object
      required: [headerName, token]
      properties:
        headerName: { type: string }
        token: { type: string }
    RegistrationRequest:
      type: object
      required: [email, displayName, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        displayName: { type: string, minLength: 2, maxLength: 120 }
        password: { type: string, minLength: 15, maxLength: 128 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    RecoveryRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, minLength: 15, maxLength: 128 }
    UpdateAccountRequest:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 2, maxLength: 120 }
    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
    AccountResponse:
      type: object
      required: [id, email, displayName]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
    OnboardingRequirements:
      type: object
      required: [termsVersion, privacyNoticeVersion]
      properties:
        termsVersion: { type: string }
        privacyNoticeVersion: { type: string }
    SaveFinancialProfileRequest:
      type: object
      required: [recurringIncome, essentialExpenses, initialGoalBalance, confirmedMonthlyCapacity, termsAccepted, privacyNoticeAcknowledged]
      properties:
        recurringIncome: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }
        essentialExpenses: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }
        initialGoalBalance: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }
        confirmedMonthlyCapacity: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }
        termsAccepted: { type: boolean }
        privacyNoticeAcknowledged: { type: boolean }
    FinancialProfile:
      type: object
      required: [spaceId, recurringIncome, essentialExpenses, initialGoalBalance, suggestedMonthlyCapacity, confirmedMonthlyCapacity, currency, referenceDate]
      properties:
        spaceId: { type: string, format: uuid }
        recurringIncome: { type: string }
        essentialExpenses: { type: string }
        initialGoalBalance: { type: string }
        suggestedMonthlyCapacity: { type: string }
        confirmedMonthlyCapacity: { type: string }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        referenceDate: { type: string, format: date }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: "^-?[0-9]+(\\.[0-9]{1,2})?$" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
    CreateGoalRequest:
      type: object
      required: [goalType, title, targetAmount, targetValueBasis, targetDate, initialBalance, annualInflationRate, annualReturnRate, contributionTiming]
      properties:
        goalType: { type: string, enum: [HOME_DOWN_PAYMENT, EMERGENCY_RESERVE, VEHICLE, TRAVEL, CUSTOM] }
        title: { type: string, minLength: 2, maxLength: 120 }
        targetAmount: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }
        targetValueBasis: { type: string, enum: [CURRENT_VALUE, FIXED_NOMINAL] }
        targetDate: { type: string, format: date }
        initialBalance: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }
        annualInflationRate: { type: string, pattern: "^-?[0-9]+(\\.[0-9]{1,8})?$" }
        annualReturnRate: { type: string, pattern: "^-?[0-9]+(\\.[0-9]{1,8})?$" }
        contributionTiming: { type: string, enum: [END_OF_MONTH, BEGINNING_OF_MONTH] }
    GoalProjection:
      type: object
      required: [targetNominal, requiredMonthlyContribution, projectedValueAtTarget, estimatedCompletionDate, totalContributed, projectedGrowth, shortfallOrSurplus, projectionMonths, warnings, engineVersion, formulaVersion]
      properties:
        targetNominal: { $ref: "#/components/schemas/Money" }
        requiredMonthlyContribution: { $ref: "#/components/schemas/Money" }
        projectedValueAtTarget: { $ref: "#/components/schemas/Money" }
        estimatedCompletionDate: { type: string, format: date }
        totalContributed: { $ref: "#/components/schemas/Money" }
        projectedGrowth: { $ref: "#/components/schemas/Money" }
        shortfallOrSurplus: { $ref: "#/components/schemas/Money" }
        projectionMonths: { type: integer, minimum: 1 }
        warnings:
          type: array
          items:
            type: string
            enum: [TARGET_ALREADY_FUNDED, NEGATIVE_RETURN_ASSUMPTION, INFLATION_NOT_INCLUDED, FEES_NOT_INCLUDED, TAXES_NOT_INCLUDED, CONTRIBUTION_EXCEEDS_DECLARED_CAPACITY, PROJECTION_NOT_GUARANTEE]
        engineVersion: { type: string }
        formulaVersion: { type: string }
    Contribution:
      type: object
      required: [id, amount, contributionDate, createdAt]
      properties:
        id: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Money" }
        contributionDate: { type: string, format: date }
        note: { type: [string, "null"], maxLength: 240 }
        createdAt: { type: string, format: date-time }
    Goal:
      type: object
      required: [id, spaceId, goalType, title, targetAmount, targetValueBasis, targetDate, initialBalance, annualInflationRate, annualReturnRate, contributionTiming, status, version, projection, currentBalance, remainingAmount, progressPercentage, contributions, createdAt]
      properties:
        id: { type: string, format: uuid }
        spaceId: { type: string, format: uuid }
        goalType: { type: string, enum: [HOME_DOWN_PAYMENT, EMERGENCY_RESERVE, VEHICLE, TRAVEL, CUSTOM] }
        title: { type: string }
        targetAmount: { $ref: "#/components/schemas/Money" }
        targetValueBasis: { type: string, enum: [CURRENT_VALUE, FIXED_NOMINAL] }
        targetDate: { type: string, format: date }
        initialBalance: { $ref: "#/components/schemas/Money" }
        annualInflationRate: { type: string }
        annualReturnRate: { type: string }
        contributionTiming: { type: string, enum: [END_OF_MONTH, BEGINNING_OF_MONTH] }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        version: { type: integer, format: int64 }
        projection: { $ref: "#/components/schemas/GoalProjection" }
        currentBalance: { $ref: "#/components/schemas/Money" }
        remainingAmount: { $ref: "#/components/schemas/Money" }
        progressPercentage: { type: string }
        contributions:
          type: array
          items: { $ref: "#/components/schemas/Contribution" }
        createdAt: { type: string, format: date-time }
    ContributionRequest:
      type: object
      required: [amount, contributionDate]
      properties:
        amount: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }
        contributionDate: { type: string, format: date }
        note: { type: string, maxLength: 240 }
    ContributionResult:
      type: object
      required: [contribution, goal]
      properties:
        contribution: { $ref: "#/components/schemas/Contribution" }
        goal: { $ref: "#/components/schemas/Goal" }
    CreateScenarioRequest:
      type: object
      required: [title, targetDate, annualInflationRate, annualReturnRate, contributionTiming]
      properties:
        title: { type: string, minLength: 2, maxLength: 80 }
        targetDate: { type: string, format: date }
        annualInflationRate: { type: string, pattern: "^-?[0-9]+(\\.[0-9]{1,8})?$" }
        annualReturnRate: { type: string, pattern: "^-?[0-9]+(\\.[0-9]{1,8})?$" }
        contributionTiming: { type: string, enum: [END_OF_MONTH, BEGINNING_OF_MONTH] }
    ScenarioProjection:
      type: object
      required: [targetNominal, requiredMonthlyContribution, estimatedCompletionDate, projectionMonths, warnings, engineVersion, formulaVersion]
      properties:
        targetNominal: { $ref: "#/components/schemas/Money" }
        requiredMonthlyContribution: { $ref: "#/components/schemas/Money" }
        estimatedCompletionDate: { type: string, format: date }
        projectionMonths: { type: integer, minimum: 1 }
        warnings: { type: array, items: { type: string } }
        engineVersion: { type: string }
        formulaVersion: { type: string }
    Scenario:
      type: object
      required: [id, title, targetDate, annualInflationRate, annualReturnRate, contributionTiming, projection, requiredContributionDelta, targetNominalDelta, projectionMonthsDelta, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        targetDate: { type: string, format: date }
        annualInflationRate: { type: string }
        annualReturnRate: { type: string }
        contributionTiming: { type: string, enum: [END_OF_MONTH, BEGINNING_OF_MONTH] }
        projection: { $ref: "#/components/schemas/ScenarioProjection" }
        requiredContributionDelta: { $ref: "#/components/schemas/Money" }
        targetNominalDelta: { $ref: "#/components/schemas/Money" }
        projectionMonthsDelta: { type: integer }
        createdAt: { type: string, format: date-time }
    ScenarioComparison:
      type: object
      required: [base, scenarios, scenarioEngineVersion]
      properties:
        base: { $ref: "#/components/schemas/ScenarioProjection" }
        scenarios: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/Scenario" } }
        scenarioEngineVersion: { type: string }
    ReauthenticationRequest:
      type: object
      required: [password]
      properties:
        password: { type: string }
    DataSubjectRequest:
      type: object
      required: [id, type, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [EXPORT, DELETION] }
        status: { type: string, enum: [COMPLETED, REQUESTED, BLOCKED] }
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
    PersonalDataExport:
      type: object
      required: [account, financialProfile, goals, consents]
      properties:
        account: { $ref: "#/components/schemas/ExportedAccount" }
        financialProfile:
          oneOf:
            - { $ref: "#/components/schemas/ExportedFinancialProfile" }
            - { type: "null" }
        goals:
          type: array
          items: { $ref: "#/components/schemas/ExportedGoal" }
        consents:
          type: array
          items:
            type: object
            required: [purpose, documentVersion, decision, recordedAt]
            properties:
              purpose: { type: string }
              documentVersion: { type: string }
              decision: { type: string }
              recordedAt: { type: string, format: date-time }
    ExportedAccount:
      type: object
      required: [id, email, displayName, createdAt, emailVerifiedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        createdAt: { type: string, format: date-time }
        emailVerifiedAt: { type: string, format: date-time }
    ExportedFinancialProfile:
      type: object
      required: [recurringIncome, essentialExpenses, initialGoalBalance, suggestedMonthlyCapacity, confirmedMonthlyCapacity, currency, referenceDate]
      properties:
        recurringIncome: { type: string }
        essentialExpenses: { type: string }
        initialGoalBalance: { type: string }
        suggestedMonthlyCapacity: { type: string }
        confirmedMonthlyCapacity: { type: string }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        referenceDate: { type: string, format: date }
    ExportedGoal:
      type: object
      required: [id, title, goalType, targetAmount, currency, targetValueBasis, targetDate, initialBalance, annualInflationRate, annualReturnRate, contributionTiming, plannedMonthlyContribution, status, engineVersion, formulaVersion, createdAt, contributions, scenarios]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        goalType: { type: string }
        targetAmount: { type: string }
        currency: { type: string }
        targetValueBasis: { type: string }
        targetDate: { type: string, format: date }
        initialBalance: { type: string }
        annualInflationRate: { type: string }
        annualReturnRate: { type: string }
        contributionTiming: { type: string }
        plannedMonthlyContribution: { type: string }
        status: { type: string }
        engineVersion: { type: string }
        formulaVersion: { type: string }
        createdAt: { type: string, format: date-time }
        contributions:
          type: array
          items: { $ref: "#/components/schemas/ExportedContribution" }
        scenarios:
          type: array
          items: { $ref: "#/components/schemas/ExportedScenario" }
    ExportedScenario:
      type: object
      required: [id, title, targetDate, annualInflationRate, annualReturnRate, contributionTiming, engineVersion, formulaVersion, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
