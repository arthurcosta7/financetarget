name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security:
    name: Dependências
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Auditar dependências de produção e manifests
        shell: pwsh
        run: ./scripts/security-audit.ps1
      - name: Validar regras de observabilidade
        shell: pwsh
        run: ./scripts/validate-observability.ps1

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:api
      - name: Verificar contrato gerado versionado
        run: git diff --exit-code -- apps/web/src/lib/api/generated/schema.d.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:ci
      - run: pnpm build

  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Testar, migrar banco efêmero e empacotar
        working-directory: apps/api
        run: ./mvnw --batch-mode verify

  release-artifacts:
    name: Artefatos de release
    needs: [security, web, api]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Construir imagens OCI rastreáveis e sem root
        shell: pwsh
        run: ./scripts/build-release.ps1 -Revision '${{ github.sha }}'
      - name: Validar perfil de produção, migrations e smoke local
        shell: pwsh
        run: ./scripts/validate-release.ps1 -Revision '${{ github.sha }}'
